name: windows-release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  WINDOWS_PACKAGE_ID: "com.devcrew.desktop"
  WINDOWS_PUBLISHER: "CN=DevCrew"

jobs:
  windows-release:
    runs-on: windows-latest
    concurrency:
      group: windows-release-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Extract version from tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Only stable tags in format vX.Y.Z are allowed (example: v1.0.0)."
          }

          $versionNoV = $env:GITHUB_REF_NAME.Substring(1)
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION_NO_V=$versionNoV"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_DOTNET_ENVIRONMENT=Production"

      - name: Set .NET runtime environment variables
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "DOTNET_ENVIRONMENT=$env:RELEASE_DOTNET_ENVIRONMENT"
          Add-Content -Path $env:GITHUB_ENV -Value "ASPNETCORE_ENVIRONMENT=$env:RELEASE_DOTNET_ENVIRONMENT"

      - name: Build desktop project
        run: |
          dotnet build src/DevCrew.Desktop/DevCrew.Desktop.csproj -c Release /property:GenerateFullPaths=true /consoleloggerparameters:NoSummary

      - name: Run core tests
        run: |
          dotnet test tests/DevCrew.Core.Tests/DevCrew.Core.Tests.csproj -c Release

      - name: Publish Windows desktop app
        run: |
          dotnet publish src/DevCrew.Desktop/DevCrew.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION_NO_V -p:DebugSymbols=false -p:DebugType=none -o ./artifacts/publish/desktop/win-x64

      - name: Publish Windows CLI binary
        run: |
          dotnet publish src/DevCrew.Cli/DevCrew.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:VERSION_NO_V -p:DebugSymbols=false -p:DebugType=none -o ./artifacts/publish/cli/win-x64

      - name: Publish Windows MCP binary
        run: |
          dotnet publish src/DevCrew.Mcp/DevCrew.Mcp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$env:VERSION_NO_V -p:DebugSymbols=false -p:DebugType=none -o ./artifacts/publish/mcp/win-x64

      - name: Create MSIX package
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $versionNoV = $env:VERSION_NO_V
          $packageVersion = "$versionNoV.0"
          $publishDir = (Resolve-Path "./artifacts/publish/desktop/win-x64").Path
          $packageRoot = Join-Path $PWD "artifacts/package/windows-msix"
          $assetDir = Join-Path $packageRoot "Assets"
          $distDir = Join-Path $PWD "artifacts/dist"
          $msixPath = Join-Path $distDir "DevCrew-$versionNoV.msix"
          $cerPath = Join-Path $distDir "DevCrew-msix.cer"
          $manifestPath = Join-Path $packageRoot "AppxManifest.xml"

          Remove-Item $packageRoot, $distDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assetDir, $distDir | Out-Null

          Copy-Item -Path (Join-Path $publishDir '*') -Destination $packageRoot -Recurse -Force
          Copy-Item -Path "src\DevCrew.Desktop\Assets\icons\app-window.png" -Destination (Join-Path $assetDir "StoreLogo.png") -Force
          Copy-Item -Path "src\DevCrew.Desktop\Assets\icons\app-window.png" -Destination (Join-Path $assetDir "Square150x150Logo.png") -Force
          Copy-Item -Path "src\DevCrew.Desktop\Assets\icons\app-window.png" -Destination (Join-Path $assetDir "Square44x44Logo.png") -Force

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap rescap">
            <Identity Name="$($env:WINDOWS_PACKAGE_ID)" Publisher="$($env:WINDOWS_PUBLISHER)" Version="$packageVersion" />
            <Properties>
              <DisplayName>DevCrew</DisplayName>
              <PublisherDisplayName>DevCrew</PublisherDisplayName>
              <Description>DevCrew Desktop</Description>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="DevCrewDesktop" Executable="DevCrew.Desktop.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="DevCrew"
                                    Description="DevCrew Desktop"
                                    BackgroundColor="transparent"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png" />
              </Application>
            </Applications>
          </Package>
          "@ | Set-Content -Path $manifestPath -Encoding utf8

          $makeAppxCommand = Get-Command makeappx.exe -ErrorAction SilentlyContinue
          $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue

          $makeAppxPath = $makeAppxCommand?.Source
          $signToolPath = $signToolCommand?.Source

          $sdkBinRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"),
            (Join-Path $env:ProgramFiles "Windows Kits\10\bin")
          ) | Where-Object { $_ -and (Test-Path $_) }

          foreach ($sdkBinRoot in $sdkBinRoots) {
            if ($makeAppxPath -and $signToolPath) {
              break
            }

            $versionDirs = Get-ChildItem -Path $sdkBinRoot -Directory -ErrorAction SilentlyContinue |
              Sort-Object -Property Name -Descending

            foreach ($versionDir in $versionDirs) {
              $x64Dir = Join-Path $versionDir.FullName "x64"
              if (-not (Test-Path $x64Dir)) {
                continue
              }

              if (-not $makeAppxPath) {
                $candidateMakeAppx = Join-Path $x64Dir "makeappx.exe"
                if (Test-Path $candidateMakeAppx) {
                  $makeAppxPath = $candidateMakeAppx
                }
              }

              if (-not $signToolPath) {
                $candidateSignTool = Join-Path $x64Dir "signtool.exe"
                if (Test-Path $candidateSignTool) {
                  $signToolPath = $candidateSignTool
                }
              }

              if ($makeAppxPath -and $signToolPath) {
                break
              }
            }
          }

          if (-not $makeAppxPath) {
            throw "makeappx.exe was not found. Checked PATH and Windows SDK bin folders under Program Files."
          }

          if (-not $signToolPath) {
            throw "signtool.exe was not found. Checked PATH and Windows SDK bin folders under Program Files."
          }

          Write-Host "Using makeappx: $makeAppxPath"
          Write-Host "Using signtool: $signToolPath"

          & $makeAppxPath pack /d $packageRoot /p $msixPath /o | Out-Host

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw "Missing required secret WINDOWS_SIGNING_CERT_BASE64. Add your base64-encoded PFX to repository secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Missing required secret WINDOWS_SIGNING_CERT_PASSWORD. Add your PFX password to repository secrets."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "devcrew-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          )

          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfxPath, $env:WINDOWS_SIGNING_CERT_PASSWORD, 'Exportable,PersistKeySet')
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          & $signToolPath sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msixPath | Out-Host

          Get-ChildItem $distDir
          if (-not (Test-Path $msixPath)) {
            throw "MSIX package was not created."
          }
          if (-not (Test-Path $cerPath)) {
            throw "MSIX certificate was not created."
          }

      - name: Generate Sparkle AppCast for Windows
        shell: pwsh
        run: |
          $appCastFileName = "appcast-windows.xml"
          $appCastBuildVersion = "${{ github.run_number }}"
          $appCastTempPath = Join-Path $env:RUNNER_TEMP $appCastFileName

          Add-Content -Path $env:GITHUB_ENV -Value "APPCAST_WINDOWS_FILENAME=$appCastFileName"
          Add-Content -Path $env:GITHUB_ENV -Value "APPCAST_WINDOWS_TEMP_PATH=$appCastTempPath"

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>Version $($env:VERSION_NO_V)</title>
                  <item>
                      <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}</sparkle:releaseNotesLink>
                      <pubDate>$((Get-Date).ToUniversalTime().ToString("ddd, dd MMM yyyy HH:mm:ss 'GMT'", [System.Globalization.CultureInfo]::InvariantCulture))</pubDate>
                      <enclosure url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/DevCrew-$($env:VERSION_NO_V).msix"
                                 sparkle:version="$appCastBuildVersion"
                                 sparkle:short_version="$($env:VERSION_NO_V)"
                                 sparkle:shortVersionString="$($env:VERSION_NO_V)"
                                 sparkle:os="windows"
                                 type="application/octet-stream" />
                  </item>
              </channel>
          </rss>
          "@ | Set-Content -Path $appCastTempPath -Encoding utf8

      - name: Commit Windows AppCast to main branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B appcast-update origin/main

          New-Item -ItemType Directory -Force -Path "./Appcasts" | Out-Null
          Copy-Item -Path $env:APPCAST_WINDOWS_TEMP_PATH -Destination "./Appcasts/$($env:APPCAST_WINDOWS_FILENAME)" -Force

          git add "./Appcasts/$($env:APPCAST_WINDOWS_FILENAME)"

          if (git diff --cached --quiet) {
            Write-Host "No Windows AppCast changes detected."
            exit 0
          }

          git commit -m "chore(appcast): update windows appcast for $env:GITHUB_REF_NAME"

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            Write-Host "Push failed on attempt $attempt; rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          }

          throw "Failed to push windows appcast update after retries."

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: DevCrew-windows-installer-${{ env.VERSION_NO_V }}
          path: |
            ./artifacts/dist/DevCrew-${{ env.VERSION_NO_V }}.msix
            ./artifacts/dist/DevCrew-msix.cer

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: DevCrew v${{ env.VERSION_NO_V }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ./artifacts/dist/DevCrew-${{ env.VERSION_NO_V }}.msix
            ./artifacts/dist/DevCrew-msix.cer
